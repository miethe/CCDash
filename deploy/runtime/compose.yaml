name: ccdash

x-backend-build: &backend-build
  context: ../..
  dockerfile: deploy/runtime/Dockerfile
  args:
    BUILD_UID: "${CCDASH_UID:-1000}"
    BUILD_GID: "${CCDASH_GID:-1000}"

x-backend-service: &backend-service
  build: *backend-build
  init: true
  restart: unless-stopped
  user: "${CCDASH_UID:-1000}:${CCDASH_GID:-1000}"
  environment: &backend-shared-env
    CCDASH_PROJECT_ROOT: "${CCDASH_PROJECT_ROOT:-/app}"
    CCDASH_HOST: "0.0.0.0"
    CCDASH_PORT: "8000"
    CCDASH_FRONTEND_ORIGIN: "${CCDASH_FRONTEND_ORIGIN:-http://localhost:${CCDASH_FRONTEND_PORT:-3000}}"
    CCDASH_OTEL_ENABLED: "${CCDASH_OTEL_ENABLED:-false}"
    CCDASH_OTEL_ENDPOINT: "${CCDASH_OTEL_ENDPOINT:-http://localhost:4318}"
    CCDASH_OTEL_SERVICE_NAME: "${CCDASH_OTEL_SERVICE_NAME:-ccdash-backend}"
    CCDASH_PROM_PORT: "${CCDASH_PROM_PORT:-9464}"
    CCDASH_STORAGE_SHARED_POSTGRES: "${CCDASH_STORAGE_SHARED_POSTGRES:-false}"
    CCDASH_STORAGE_ISOLATION_MODE: "${CCDASH_STORAGE_ISOLATION_MODE:-dedicated}"
    CCDASH_STORAGE_SCHEMA: "${CCDASH_STORAGE_SCHEMA:-ccdash}"
    CCDASH_ENTERPRISE_FILESYSTEM_INGESTION_ENABLED: "${CCDASH_ENTERPRISE_FILESYSTEM_INGESTION_ENABLED:-true}"
    CCDASH_STARTUP_SYNC_ENABLED: "${CCDASH_STARTUP_SYNC_ENABLED:-true}"
    CCDASH_STARTUP_SYNC_LIGHT_MODE: "${CCDASH_STARTUP_SYNC_LIGHT_MODE:-false}"
    CCDASH_STARTUP_DEFERRED_REBUILD_LINKS: "${CCDASH_STARTUP_DEFERRED_REBUILD_LINKS:-false}"
    CCDASH_STARTUP_DEFERRED_CAPTURE_ANALYTICS: "${CCDASH_STARTUP_DEFERRED_CAPTURE_ANALYTICS:-false}"
    CCDASH_INFERRED_STATUS_WRITEBACK_ENABLED: "${CCDASH_INFERRED_STATUS_WRITEBACK_ENABLED:-false}"
    CCDASH_ROUTING_FEEDBACK_ENABLED: "${CCDASH_ROUTING_FEEDBACK_ENABLED:-false}"
    CCDASH_ROUTING_FEEDBACK_MIN_SAMPLE_SIZE: "${CCDASH_ROUTING_FEEDBACK_MIN_SAMPLE_SIZE:-5}"
    CCDASH_ROUTING_FEEDBACK_WINDOW_DAYS: "${CCDASH_ROUTING_FEEDBACK_WINDOW_DAYS:-30}"
    CCDASH_ROUTING_FEEDBACK_INCLUDE_PROTECTED_ROWS: "${CCDASH_ROUTING_FEEDBACK_INCLUDE_PROTECTED_ROWS:-true}"
    CCDASH_ROUTING_FEEDBACK_SWEEP_INTERVAL_SECONDS: "${CCDASH_ROUTING_FEEDBACK_SWEEP_INTERVAL_SECONDS:-1800}"
    # Capability flags. All default to the same value as backend/config.py, so an
    # unset host env is behaviour-identical to not listing them here at all. They
    # must be listed: this environment map is an explicit allowlist, so a flag set
    # only in .env never reaches the container namespace.
    CCDASH_MULTI_PROJECT_COMMAND_CENTER_ENABLED: "${CCDASH_MULTI_PROJECT_COMMAND_CENTER_ENABLED:-false}"
    CCDASH_CODEX_INGEST_ENABLED: "${CCDASH_CODEX_INGEST_ENABLED:-false}"
    CCDASH_CODEX_SESSIONS_PATH: "${CCDASH_CODEX_SESSIONS_PATH:-}"
    CCDASH_CODEX_BACKFILL_DAYS: "${CCDASH_CODEX_BACKFILL_DAYS:-7}"
    CCDASH_ARTIFACT_INTELLIGENCE_ENABLED: "${CCDASH_ARTIFACT_INTELLIGENCE_ENABLED:-false}"
    CCDASH_ARC_ENABLED: "${CCDASH_ARC_ENABLED:-false}"
    CCDASH_MEATYWIKI_ENABLED: "${CCDASH_MEATYWIKI_ENABLED:-false}"
    # automatic-session-naming-v1 M3 (T3-003): the Lane B hosted
    # derived-naming backend's API key. Same gap class 5cb8e00 fixed for
    # five other flags -- this map is an explicit allowlist, so a key set
    # only in .env would never reach the container namespace, silently
    # leaving the hosted backend permanently disabled (fail-open, but for
    # the wrong reason) even after an operator opts in via
    # CCDASH_SESSION_NAMING_BACKEND=hosted. Default empty, identical to
    # backend/config.py's own default -- unset host env is
    # behaviour-identical to not listing it here.
    CCDASH_GEMINI_API_KEY: "${CCDASH_GEMINI_API_KEY:-}"
    # automatic-session-naming-v1 M3 (T3-001/T3-002/T3-003/T3-004): the
    # SessionNamingSweepJob guard-flag quartet + backend selector +
    # local-lane URL. Same gap class as CCDASH_GEMINI_API_KEY directly
    # above -- flagged but explicitly left unfixed by T3-003 (see
    # implementation-notes.md) because none of these six were in that
    # task's scope. Without this block, CCDASH_SESSION_NAMING_ENABLED set
    # only in .env never reaches the worker container namespace, so the
    # sweep can never be turned on for a node deployment regardless of the
    # backend logic above being correct. Defaults mirror
    # backend/config.py's own defaults exactly -- unset host env is
    # behaviour-identical to not listing them here.
    CCDASH_SESSION_NAMING_ENABLED: "${CCDASH_SESSION_NAMING_ENABLED:-false}"
    CCDASH_SESSION_NAMING_QUOTA: "${CCDASH_SESSION_NAMING_QUOTA:-200}"
    CCDASH_SESSION_NAMING_WINDOW_HOURS: "${CCDASH_SESSION_NAMING_WINDOW_HOURS:-24}"
    CCDASH_SESSION_NAMING_SWEEP_INTERVAL_SECONDS: "${CCDASH_SESSION_NAMING_SWEEP_INTERVAL_SECONDS:-1800}"
    CCDASH_SESSION_NAMING_BACKEND: "${CCDASH_SESSION_NAMING_BACKEND:-local}"
    CCDASH_OLLAMA_BASE_URL: "${CCDASH_OLLAMA_BASE_URL:-http://localhost:11434}"
    # The remaining two Ollama flags, added at the feature-level review (finding L-5):
    # the block above shipped six of eight and left these out, which is the SAME
    # explicit-allowlist gap the comment above is about -- a containerised deployment
    # would have been pinned to gemma2:2b / 15s with no override, failing silently.
    # NOTE on CCDASH_OLLAMA_BASE_URL's default: "localhost" resolves to the CONTAINER's
    # own loopback, where no Ollama daemon runs. A compose deployment that wants the
    # (default, zero-egress) local lane to actually function must point this at the
    # host -- e.g. http://host.containers.internal:11434 under podman. Left as-is so
    # the default matches backend/config.py exactly; see deploy/runtime/.env.example.
    CCDASH_OLLAMA_MODEL: "${CCDASH_OLLAMA_MODEL:-gemma2:2b}"
    # 60, not 15, since 2026-08-09: the old default sat BELOW measured cold-start
    # latency (25.6s cold / 13.7s warm, gemma2:2b on the agentic node, measured
    # from inside this worker container) so a tick's first calls could only ever
    # time out. Kept in lockstep with backend/config.py's own default, per the
    # "defaults mirror config.py exactly" contract above.
    CCDASH_OLLAMA_TIMEOUT_SECONDS: "${CCDASH_OLLAMA_TIMEOUT_SECONDS:-60}"
    GIT_OPTIONAL_LOCKS: "${GIT_OPTIONAL_LOCKS:-0}"
  healthcheck: &api-healthcheck
    test:
      - CMD
      - python
      - -c
      - import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:" + os.environ.get("CCDASH_PORT", "8000") + "/api/health/ready", timeout=3)
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  volumes:
    - type: bind
      source: "${CCDASH_PROJECTS_FILE:-../../projects.json}"
      target: /app/projects.json
      read_only: false
    - type: bind
      source: "${CCDASH_WORKSPACE_HOST_ROOT:-../../..}"
      target: "${CCDASH_WORKSPACE_CONTAINER_ROOT:-/workspace}"
      read_only: true
    - type: bind
      source: "${CCDASH_CLAUDE_HOME:-~/.claude}"
      target: "${CCDASH_CLAUDE_CONTAINER_HOME:-/home/ccdash/.claude}"
      read_only: true
    - type: bind
      source: "${CCDASH_CODEX_HOME:-~/.codex}"
      target: "${CCDASH_CODEX_CONTAINER_HOME:-/home/ccdash/.codex}"
      read_only: true
    - type: bind
      source: "${CCDASH_EXTRA_MOUNT_1_HOST:-./empty-mounts/optional-1}"
      target: "${CCDASH_EXTRA_MOUNT_1_CONTAINER:-/mnt/ccdash/optional-1}"
      read_only: true
    - type: bind
      source: "${CCDASH_EXTRA_MOUNT_2_HOST:-./empty-mounts/optional-2}"
      target: "${CCDASH_EXTRA_MOUNT_2_CONTAINER:-/mnt/ccdash/optional-2}"
      read_only: true
    - type: bind
      source: "${CCDASH_EXTRA_MOUNT_3_HOST:-./empty-mounts/optional-3}"
      target: "${CCDASH_EXTRA_MOUNT_3_CONTAINER:-/mnt/ccdash/optional-3}"
      read_only: true
    - type: bind
      source: "${CCDASH_EXTRA_MOUNT_4_HOST:-./empty-mounts/optional-4}"
      target: "${CCDASH_EXTRA_MOUNT_4_CONTAINER:-/mnt/ccdash/optional-4}"
      read_only: true
    - type: bind
      source: "${CCDASH_EXTRA_MOUNT_5_HOST:-./empty-mounts/optional-5}"
      target: "${CCDASH_EXTRA_MOUNT_5_CONTAINER:-/mnt/ccdash/optional-5}"
      read_only: true
    - type: bind
      source: "${CCDASH_EXTRA_MOUNT_6_HOST:-./empty-mounts/optional-6}"
      target: "${CCDASH_EXTRA_MOUNT_6_CONTAINER:-/mnt/ccdash/optional-6}"
      read_only: true

x-postgres-connection: &postgres-connection
  CCDASH_STORAGE_PROFILE: "${CCDASH_STORAGE_PROFILE:-enterprise}"
  CCDASH_DB_BACKEND: "${CCDASH_DB_BACKEND:-postgres}"
  CCDASH_DATABASE_URL: "${CCDASH_DATABASE_URL:-postgresql://ccdash:ccdash@postgres:5432/ccdash}"

services:
  backend:
    <<: *backend-service
    build:
      <<: *backend-build
      target: runtime
    profiles: ["local"]
    environment:
      <<: *backend-shared-env
      CCDASH_RUNTIME_PROFILE: "local"
      CCDASH_STORAGE_PROFILE: "local"
      CCDASH_DB_BACKEND: "sqlite"
      CCDASH_DB_PATH: "${CCDASH_DB_PATH:-/var/lib/ccdash/ccdash.db}"
    ports:
      - "${CCDASH_API_PORT:-8000}:8000"
    networks:
      default:
        aliases:
          - api
    volumes:
      - ccdash-local-data:/var/lib/ccdash

  api:
    <<: *backend-service
    build:
      <<: *backend-build
      target: api
    profiles: ["enterprise"]
    environment:
      <<: [*backend-shared-env, *postgres-connection]
      CCDASH_RUNTIME_PROFILE: "api"
      CCDASH_API_BEARER_TOKEN: "${CCDASH_API_BEARER_TOKEN:-ccdash-dev-token}"
      CCDASH_QUERY_CACHE_BACKEND: "${CCDASH_QUERY_CACHE_BACKEND:-postgres}"
      # P3-006-FU: durable job queue now live — enterprise services default to postgres.
      CCDASH_JOB_QUEUE_BACKEND: "${CCDASH_JOB_QUEUE_BACKEND:-postgres}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "${CCDASH_API_PORT:-8000}:8000"

  worker:
    <<: *backend-service
    build:
      <<: *backend-build
      target: worker
    profiles: ["enterprise"]
    environment:
      <<: [*backend-shared-env, *postgres-connection]
      CCDASH_RUNTIME_PROFILE: "worker"
      CCDASH_QUERY_CACHE_BACKEND: "${CCDASH_QUERY_CACHE_BACKEND:-postgres}"
      # P3-006-FU: durable job queue now live — enterprise services default to postgres.
      CCDASH_JOB_QUEUE_BACKEND: "${CCDASH_JOB_QUEUE_BACKEND:-postgres}"
      CCDASH_WORKER_PROJECT_ID: "${CCDASH_WORKER_PROJECT_ID:-smoke-stack}"
      CCDASH_WORKER_PROBE_HOST: "${CCDASH_WORKER_PROBE_HOST:-0.0.0.0}"
      CCDASH_WORKER_PROBE_PORT: "${CCDASH_WORKER_PROBE_PORT:-9465}"
      CCDASH_STARTUP_SYNC_ENABLED: "${CCDASH_WORKER_STARTUP_SYNC_ENABLED:-false}"
      CCDASH_STARTUP_SYNC_LIGHT_MODE: "${CCDASH_STARTUP_SYNC_LIGHT_MODE:-true}"
      CCDASH_TELEMETRY_EXPORT_ENABLED: "${CCDASH_TELEMETRY_EXPORT_ENABLED:-false}"
      CCDASH_SAM_ENDPOINT: "${CCDASH_SAM_ENDPOINT:-}"
      CCDASH_SAM_API_KEY: "${CCDASH_SAM_API_KEY:-}"
      CCDASH_TELEMETRY_ALLOW_INSECURE: "${CCDASH_TELEMETRY_ALLOW_INSECURE:-false}"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:" + os.environ.get("CCDASH_WORKER_PROBE_PORT", "9465") + "/readyz", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${CCDASH_WORKER_PROBE_PORT:-9465}:${CCDASH_WORKER_PROBE_PORT:-9465}"

  # Start watcher ingest with:
  #   docker compose --profile enterprise --profile postgres --profile live-watch up
  # Registry-driven fan-out: when CCDASH_WORKER_WATCH_PROJECT_ID is empty,
  # worker-watch derives watch targets from DB registry (all registered projects;
  # is_active is a UI signal, not an ingest gate).
  # Non-empty: scopes to that specific project id (v1 behavior, one project per process).
  worker-watch:
    <<: *backend-service
    build:
      <<: *backend-build
      target: worker
    profiles: ["enterprise", "live-watch"]
    command: ["python", "-m", "backend.worker"]
    environment:
      <<: [*backend-shared-env, *postgres-connection]
      CCDASH_RUNTIME_PROFILE: "worker-watch"
      CCDASH_QUERY_CACHE_BACKEND: "${CCDASH_QUERY_CACHE_BACKEND:-postgres}"
      # P3-006-FU: durable job queue now live — enterprise services default to postgres.
      CCDASH_JOB_QUEUE_BACKEND: "${CCDASH_JOB_QUEUE_BACKEND:-postgres}"
      # P3-T3-006: Optional project id scope. Empty → registry-driven fan-out.
      CCDASH_WORKER_PROJECT_ID: "${CCDASH_WORKER_WATCH_PROJECT_ID:-${CCDASH_WORKER_PROJECT_ID:-smoke-stack}}"
      # P3-fix: forward CCDASH_WORKER_WATCH_PROJECT_ID into the container namespace so that
      # backend/config.py os.environ.get("CCDASH_WORKER_WATCH_PROJECT_ID", "") reads the
      # operator-supplied value and the env-pin single-project path is exercisable via compose.
      # Empty default → registry-driven fan-out remains the default when not set.
      CCDASH_WORKER_WATCH_PROJECT_ID: "${CCDASH_WORKER_WATCH_PROJECT_ID:-}"
      CCDASH_WORKER_PROBE_HOST: "${CCDASH_WORKER_WATCH_PROBE_HOST:-0.0.0.0}"
      CCDASH_WORKER_PROBE_PORT: "${CCDASH_WORKER_WATCH_PROBE_PORT:-9466}"
      CCDASH_ENTERPRISE_FILESYSTEM_INGESTION_ENABLED: "${CCDASH_WORKER_WATCH_FILESYSTEM_INGESTION_ENABLED:-true}"
      CCDASH_STARTUP_SYNC_ENABLED: "${CCDASH_WORKER_WATCH_STARTUP_SYNC_ENABLED:-true}"
      CCDASH_STARTUP_SYNC_LIGHT_MODE: "${CCDASH_STARTUP_SYNC_LIGHT_MODE:-true}"
      CCDASH_WATCHER_SYNC_CONCURRENCY: "${CCDASH_WATCHER_SYNC_CONCURRENCY:-20}"
      CCDASH_WATCHER_RECONCILE_INTERVAL_SECONDS: "${CCDASH_WATCHER_RECONCILE_INTERVAL_SECONDS:-60}"
      CCDASH_TELEMETRY_EXPORT_ENABLED: "${CCDASH_TELEMETRY_EXPORT_ENABLED:-false}"
      CCDASH_SAM_ENDPOINT: "${CCDASH_SAM_ENDPOINT:-}"
      CCDASH_SAM_API_KEY: "${CCDASH_SAM_API_KEY:-}"
      CCDASH_TELEMETRY_ALLOW_INSECURE: "${CCDASH_TELEMETRY_ALLOW_INSECURE:-false}"
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-true}"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen("http://127.0.0.1:" + os.environ.get("CCDASH_WORKER_WATCH_PROBE_PORT", "9466") + "/readyz", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${CCDASH_WORKER_WATCH_PROBE_PORT:-9466}:${CCDASH_WORKER_WATCH_PROBE_PORT:-9466}"

  frontend:
    profiles: ["local", "enterprise"]
    build:
      context: ../..
      dockerfile: deploy/runtime/frontend/Dockerfile
      args:
        VITE_CCDASH_API_BASE_URL: "${VITE_CCDASH_API_BASE_URL:-/api}"
    init: true
    restart: unless-stopped
    environment:
      CCDASH_FRONTEND_PORT: "${CCDASH_FRONTEND_PORT:-3000}"
      CCDASH_API_UPSTREAM: "${CCDASH_API_UPSTREAM:-http://api:8000}"
      CCDASH_API_BEARER_TOKEN: "${CCDASH_API_BEARER_TOKEN:-ccdash-dev-token}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:${CCDASH_FRONTEND_PORT:-3000}/" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${CCDASH_FRONTEND_PORT:-3000}:${CCDASH_FRONTEND_PORT:-3000}"

  postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${CCDASH_POSTGRES_DB:-ccdash}"
      POSTGRES_USER: "${CCDASH_POSTGRES_USER:-ccdash}"
      POSTGRES_PASSWORD: "${CCDASH_POSTGRES_PASSWORD:-ccdash}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${CCDASH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ccdash-postgres:/var/lib/postgresql/data

volumes:
  ccdash-local-data:
  ccdash-postgres:
