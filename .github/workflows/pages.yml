name: Deploy documentation site

# Manual-dispatch only. GitHub Pages has never been enabled for this repo with
# source "GitHub Actions", so `actions/configure-pages` cannot find a Pages site
# and the job died at that step on every push to main (red across 6+ consecutive
# runs as of 2026-08-12). A permanently-red check trains reviewers to merge over
# red and makes a genuine docs-build regression indistinguishable from the
# standing failure.
#
# The build steps themselves pass, so this workflow still has value on demand:
# dispatch it to prove `npm run build:docs` is not broken. To publish for real,
# enable Pages (Settings -> Pages -> Source = "GitHub Actions", or add
# `enablement: true` to the Configure Pages step) and restore the push trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
